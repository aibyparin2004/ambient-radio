<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA Ambient Radio</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #020617;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #020617;
      color: #fff;
      font-size: 14px;
      margin-top: 12px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
      font-size: 14px;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div className="card" id="content">
    <div className="spinner"></div>
    <p style="font-size: 14px; color: #94a3b8;">Connecting to AURA Ambient Room...</p>
  </div>

  <script>
    const DEFAULT_URL = 'http://192.168.29.195:3000';
    let savedUrl = localStorage.getItem('aura_server_url') || DEFAULT_URL;

    function attemptConnect(url) {
      window.location.replace(url);
    }

    // Try connecting immediately
    attemptConnect(savedUrl);

    // Fallback UI if connection takes long
    setTimeout(() => {
      document.body.innerHTML = `
        <div class="card">
          <h3 style="margin: 0 0 8px 0; font-size: 18px;">AURA Connection</h3>
          <p style="font-size: 12px; color: #94a3b8; margin: 0 0 12px 0;">Enter your server URL or IP address:</p>
          <input type="text" id="urlInput" value="${savedUrl}" placeholder="http://192.168.29.195:3000" />
          <button onclick="saveAndConnect()">Connect to Room</button>
        </div>
      `;
    }, 4000);

    function saveAndConnect() {
      const inputVal = document.getElementById('urlInput').value.trim();
      if (inputVal) {
        localStorage.setItem('aura_server_url', inputVal);
        window.location.replace(inputVal);
      }
    }
  </script>
</body>
</html>
